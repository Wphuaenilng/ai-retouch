services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /data
      SQLITE_PATH: /data/retouch.db
      # 上线前必须换掉：openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?请在 .env 里设置 JWT_SECRET}
      COOKIE_SECURE: "true"
      # 上游模型回拉图片时必须用公网域名
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?请填 https 域名}
      PROVIDER_PRIORITY: ${PROVIDER_PRIORITY:-seedream,mock}
      ARK_API_KEY: ${ARK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      LLM_PLAN_PROVIDER: ${LLM_PLAN_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      PER_USER_DAILY_CALLS: ${PER_USER_DAILY_CALLS:-30}
      DAILY_BUDGET_YUAN: ${DAILY_BUDGET_YUAN:-200}
      MODERATION: ${MODERATION:-qwen-vl}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_INVITE_CODE: ${BOOTSTRAP_INVITE_CODE:-}
    volumes:
      - retouch-data:/data
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  retouch-data:
  caddy-data:
  caddy-config:
